<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Font Dashboard</title>
<style>
:root{
  --bg:#f6f5f3; --panel:#fff; --ink:#1a1917; --muted:#6d6a65; --line:#e0ddd8;
  --accent:#1f6f4a; --accent-ink:#fff; --warn:#8a5a10; --warn-bg:#fdf3e2;
  --bad:#8c2f2a; --bad-bg:#fbeceb; --ok:#1f6f4a; --ok-bg:#e8f3ed;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14150f; --panel:#1c1d17; --ink:#eceade; --muted:#96948a; --line:#2e2f27;
  --accent:#6fbf8e; --accent-ink:#10160f; --warn:#e0b168; --warn-bg:#2b2416;
  --bad:#e08a82; --bad-bg:#2c1a18; --ok:#6fbf8e; --ok-bg:#16241c;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 ui-sans-serif,-apple-system,"SF Pro Text",Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);
  border-bottom:1px solid var(--line);padding:14px 20px}
.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;max-width:1100px;margin:0 auto}
h1{font-size:15px;margin:0;font-weight:640;letter-spacing:-.01em}
h1 span{color:var(--muted);font-weight:420}
.grow{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:6px 13px;border-radius:7px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--muted)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:560}
main{max-width:1100px;margin:0 auto;padding:20px}
.stats{display:flex;gap:22px;flex-wrap:wrap;color:var(--muted);margin-bottom:18px}
.stats b{color:var(--ink);font-weight:620}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.grp>summary{padding:11px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.fam{font-weight:600}
.count{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:560;color:var(--muted);padding:7px 10px;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);font-size:12px}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.path{color:var(--muted);font-size:12px;word-break:break-all;
  font-family:ui-monospace,"SF Mono",Menlo,monospace}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;
  border:1px solid var(--line);color:var(--muted);margin-right:4px;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.cfg{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;
  color:var(--muted);font-size:13px}
input[type=text]{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);color:var(--ink);min-width:340px}
.log{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  margin-bottom:16px;font-size:13px}
.log div{padding:2px 0}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
</style>
</head>
<body>
<header><div class="bar">
  <h1>Font Dashboard <span id="sub"></span></h1>
  <div class="grow"></div>
  <button id="pick">Select all new</button>
  <button id="rescan">Rescan</button>
  <button id="go" class="primary" disabled>Install</button>
</div></header>

<main>
  <div class="cfg">
    <label><input type="checkbox" id="adobe" checked> Adobe Creative Cloud cache</label>
    <input type="text" id="dirs" placeholder="~/Downloads, ~/Desktop">
    <button id="save">Apply</button>
    <div class="grow"></div>
    <label><input type="checkbox" id="showall"> show already installed</label>
  </div>
  <div class="stats" id="stats"></div>
  <div id="log"></div>
  <div id="list"></div>
</main>

<script>
const $ = s => document.querySelector(s);
let DATA = null, picked = new Set();

const fmt = n => n.toLocaleString();
const tagFor = f => {
  const cls = {incomplete:'bad', demo:'warn', mislabelled:'warn', narrower:'', }[f] ?? '';
  return `<span class="tag ${cls}">${f}</span>`;
};

async function load(){
  $('#list').innerHTML = '<div class="empty">Scanning…</div>';
  DATA = await (await fetch('/api/scan')).json();
  $('#dirs').value = DATA.scan_dirs.join(', ');
  $('#sub').textContent = '· ' + DATA.install_dir.replace(/^\/Users\/[^/]+/, '~');
  picked.clear();
  render();
}

function groups(){
  const showAll = $('#showall').checked;
  const map = new Map();
  for (const c of DATA.candidates){
    if (c.installed && !showAll) continue;
    const k = c.family || c.psname;
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(c);
  }
  return [...map.entries()].sort((a,b) => a[0].localeCompare(b[0]));
}

function render(){
  const gs = groups();
  const newOnes = DATA.candidates.filter(c => !c.installed && c.recommended);
  $('#stats').innerHTML = `
    <div><b>${fmt(newOnes.length)}</b> new to install</div>
    <div><b>${fmt(DATA.installed_count)}</b> already in your Fonts folder</div>
    <div><b>${fmt(DATA.candidates.length)}</b> font files found</div>
    ${DATA.adobe_dir ? '<div>Adobe cache found</div>' : '<div>No Adobe cache</div>'}`;

  if (!gs.length){
    $('#list').innerHTML = `<div class="empty">Nothing new. Every font found is already installed.<br>
      Tick <em>show already installed</em> to see everything.</div>`;
    return sync();
  }

  $('#list').innerHTML = gs.map(([fam, rows]) => {
    const anyNew = rows.some(r => !r.installed);
    return `<details class="grp" ${anyNew ? 'open' : ''}>
      <summary><span class="fam">${esc(fam)}</span>
        <span class="count">${rows.length} file${rows.length>1?'s':''}</span>
        ${anyNew ? '' : '<span class="tag ok">installed</span>'}</summary>
      <table><thead><tr>
        <th style="width:30px"></th><th>Style</th><th>Format</th>
        <th class="num">Glyphs</th><th>Notes</th><th>Where it came from</th>
      </tr></thead><tbody>
      ${rows.map(r => `<tr>
        <td>${r.installed ? '' :
          `<input type="checkbox" data-id="${r.id}" ${picked.has(r.id)?'checked':''}>`}</td>
        <td><div>${esc(r.style || 'Regular')}</div>
            <div class="path">${esc(r.suggested)}</div></td>
        <td>${r.outlines}${r.recommended && r.alternatives ? ' <span class="tag ok">best</span>':''}</td>
        <td class="num">${fmt(r.chars)}</td>
        <td>${r.installed ? '<span class="tag ok">installed</span>' : ''}
            ${r.flags.map(tagFor).join('')}
            ${r.missing.length ? `<span class="tag bad">no ${esc(r.missing.join(', '))}</span>`:''}</td>
        <td><div>${r.source === 'adobe' ? 'Adobe CC' : r.source === 'zip' ? 'inside a zip' : 'file'}</div>
            <div class="path">${esc(short(r.member || r.origin))}</div></td>
      </tr>`).join('')}
      </tbody></table></details>`;
  }).join('');

  $('#list').querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.onchange = () => { cb.checked ? picked.add(cb.dataset.id) : picked.delete(cb.dataset.id); sync(); };
  });
  sync();
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short = p => String(p).replace(/^\/Users\/[^/]+/, '~');
const sync = () => {
  $('#go').disabled = !picked.size;
  $('#go').textContent = picked.size ? `Install ${picked.size}` : 'Install';
};

$('#pick').onclick = () => {
  for (const c of DATA.candidates) if (!c.installed && c.recommended) picked.add(c.id);
  render();
};
$('#rescan').onclick = load;
$('#showall').onchange = render;
$('#save').onclick = async () => {
  await fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({adobe: $('#adobe').checked,
      scan_dirs: $('#dirs').value.split(',').map(s=>s.trim()).filter(Boolean)})});
  load();
};
$('#go').onclick = async () => {
  $('#go').disabled = true; $('#go').textContent = 'Installing…';
  const r = await (await fetch('/api/install', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ids:[...picked]})})).json();
  const ok = r.results.filter(x=>x.ok).length;
  $('#log').innerHTML = `<div class="log"><b>${ok} installed</b>, ${r.results.length-ok} skipped.
    ${r.results.map(x=>`<div>${x.ok?'✓':'·'} ${esc(x.name||x.id)} — ${esc(x.msg)}</div>`).join('')}
    <div style="margin-top:8px;color:var(--muted)">Restart Figma or Illustrator to see them.</div></div>`;
  picked.clear();
  await load();
};
load();
</script>
</body>
</html>
